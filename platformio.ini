; Tunturi FitCycle 50i tools for the Waveshare ESP32-C6-LCD-1.47.
; The C6 needs Arduino core 3.x, which the official PlatformIO platform lacks,
; so use the pioarduino fork.
;
;   pio run -e bridge -t upload    FTMS bridge bike -> Garmin (default)
;   pio run -e sniffer -t upload   BLE sniffer / protocol explorer

[platformio]
default_envs = bridge

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, log2file
lib_deps =
    h2zero/NimBLE-Arduino@2.3.0
    moononournation/GFX Library for Arduino@1.5.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:bridge]
build_src_filter = +<bridge/>
; BLE + Wi-Fi + web server need more than the default 1.25 MB app slot.
; Same NVS location as the default table, so saved data survives the switch.
board_build.partitions = min_spiffs.csv

[env:sniffer]
build_src_filter = +<sniffer/>
